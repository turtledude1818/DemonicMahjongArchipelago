# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Demonic Mahjong Template

game: Demonic Mahjong
requires:
  version: 0.6.8 # Version of Archipelago required for this yaml to work as expected.

Demonic Mahjong:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  starting_characters:
    # Choose how many characters will be unlocked by default.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 28
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-28: 0 # random value between 1 and 28

  starting_figurines:
    # Choose how many figurines will be unlocked by default.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 222
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-222: 0 # random value between 0 and 222

  starting_relics:
    # Choose how many relics will be unlocked by default.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 109
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-109: 0 # random value between 0 and 109

  victory_condition:
    # Win with Characters: Win a run with the specified number of unique characters.
    # Beat Difficulty: Win a run on the specified difficulty level with any character.
    # Earn Achievements: Earn the specified number of in game achievements to win.
    # Complete Yaku: Score hands with the specified number of unique yaku (patterns) to win.
    # Multiple Conditions: Combine multiple other conditions.
    multiple_conditions: 50
    win_with_characters: 0
    beat_difficulty: 0
    earn_achievements: 0
    complete_yaku: 0

  character_victory:
    # Specify the number of characters you need to win with to win.
    # This option only applies when victory condition is set to multiple conditions or to characters.
    # Set to 0 to disable condition when using multiple victory conditions.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 28
    10: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-28: 0 # random value between 0 and 28

  character_min_difficulty:
    # Specify the minimum difficulty required for a win to count as clearing the character.
    # This applies to both locations and victory conditions.
    # If Scaling Minimum Difficulty is enabled, this is the maximum difficulty it will scale to.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 8
    4: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-8: 0 # random value between 0 and 8

  scaling_min_difficulty:
    # If this option is enabled, the minimum difficulty required to count a character as cleared will     start at one and increase by one after each new character cleared, up to the Minimum Difficulty setting.
    # This allows counting clears before harder difficulties are unlocked.
    'false': 0
    'true': 50

  difficulty_victory:
    # Specify the maximum difficulty you need to beat to win.
    # This option only applies when victory condition is set to multiple conditions or to difficulty.
    # Set to 0 to disable condition when using multiple victory conditions.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 8
    8: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-8: 0 # random value between 0 and 8

  achievement_victory:
    # Specify the number of achievements you need to earn to win.
    # This option only applies when victory condition is set to multiple conditions or to achievements.
    # Set to 0 to disable condition when using multiple victory conditions.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 148
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-148: 0 # random value between 0 and 148

  yaku_victory:
    # Specify the number of unique yaku (patterns) you need to complete to win.
    # This option only applies when victory condition is set to multiple conditions or to yaku.
    # Set to 0 to disable condition when using multiple victory conditions.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 121
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-121: 0 # random value between 0 and 121

  trap_chance:
    # Percent chance a randomly generated filler item will be replaced with a trap item
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: {Bomb: 1, Arrow: 3}
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
